spring:
  application:
    name: reconcileiq-api
  datasource:
    url: jdbc:postgresql://localhost:5433/reconcileiq
    username: reconcileiq
    password: local_dev_only_change_me
  jpa:
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

paypal:
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}

ai:
  provider: ollama
  ollama:
    base-url: http://localhost:11434
    model: qwen3:8b
    timeout-seconds: 120

reconcileiq:
  data-source: ${RECONCILEIQ_DATA_SOURCE:DEMO_SCENARIOS}
  ai:
    provider: ${RECONCILEIQ_AI_PROVIDER:OLLAMA}
    base-url: ${RECONCILEIQ_AI_BASE_URL:http://localhost:11434}
    model: ${RECONCILEIQ_AI_MODEL:qwen3:8b}
    temperature: 0.1
    timeout-seconds: 60
    prompt-version: v1
    api-key: ${RECONCILEIQ_AI_API_KEY:}
  notifications:
    # Zapier "Catch Hook" URL. Leave empty to disable the run-completed email.
    zapier-webhook-url: ${ZAPIER_WEBHOOK_URL:}
    # Public URL of the hosted dashboard, used for the "View reconciliation report" link.
    dashboard-url: ${RECONCILEIQ_DASHBOARD_URL:http://localhost:5173}
